[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cvlab"
version = "1.0.0"
description = "Cats vs Dogs: classification and detection under small-data constraints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["computer-vision", "image-classification", "object-detection", "transfer-learning", "yolov8"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
]

[project.optional-dependencies]
classification = ["tensorflow>=2.15"]
detection = ["torch>=2.1", "torchvision>=0.16", "ultralytics>=8.1", "pycocotools>=2.0.7"]
dev = ["ruff>=0.4", "pytest>=7.4", "nbstripout>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
