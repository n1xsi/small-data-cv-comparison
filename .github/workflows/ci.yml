name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the package and lint/test tooling
        run: |
          python -m pip install --upgrade pip
          # `-e .` installs cvlab plus its base dependencies, so `import cvlab`
          # resolves without PYTHONPATH games. The heavy extras (tensorflow, torch,
          # ultralytics) are deliberately left out: the tests below cover
          # framework-independent logic only.
          pip install -e .
          pip install ruff pytest

      - name: Lint
        run: ruff check src scripts tests

      - name: Format check
        run: ruff format --check src scripts tests

      - name: Run tests
        run: pytest -q
